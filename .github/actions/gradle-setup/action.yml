name: 'Gradle Setup'
description: 'Sets up Java (JDK 17), Gradle wrapper, caching, and execution permissions'

runs:
  using: 'composite'
  steps:
    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew
